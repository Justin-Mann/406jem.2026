@if (loading()) {
  <div class="row justify-content-center g-4 mt-2">
    <div class="col-sm-8 col-12">
      <mat-card appearance="outlined" class="jem-mat-card h-100">
        <mat-card-header>
          <mat-card-title>GitHub Activity</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p class="text-center">Loading GitHub activity...</p>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
} @else if (repos()) {
  <div class="row justify-content-center g-4 mt-2">
    <div class="col-sm-8 col-12">
      <mat-card appearance="outlined" class="jem-mat-card h-100">
        <mat-card-header>
          <mat-card-title>GitHub Activity</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <ul class="github-activity-list">
            @for (repo of repos()!; track repo.name) {
              <li class="github-activity-item">
                <a [href]="repo.html_url" target="_blank" rel="noopener" class="github-activity-name">{{ repo.name }}</a>
                @if (repo.description) {
                  <p class="github-activity-description">{{ repo.description }}</p>
                }
                @if (repo.language) {
                  <span class="github-activity-meta">{{ repo.language }}</span>
                }
              </li>
            }
          </ul>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
}
